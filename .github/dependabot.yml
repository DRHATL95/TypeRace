version: 2
updates:
  # Actions only. npm/nuget/cargo version updates are deliberately not enabled here -
  # security updates already arrive without any config, and turning on version updates
  # for those ecosystems would open a PR per dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One PR for all action bumps rather than one per action.
      actions:
        patterns:
          - "*"
